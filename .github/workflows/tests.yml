name: Offline engine tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --frozen --all-extras
      - run: uv run --frozen --all-extras pytest
      - run: uv run --frozen --all-extras equipment-data-manager --check-config config.example.toml
      - run: uv build
      - run: uv run --isolated --no-project --with ./dist/equipment_data_manager-0.1.0-py3-none-any.whl python -I -m equipment_data_manager
      - run: uv run --isolated --no-project --with ./dist/equipment_data_manager-0.1.0-py3-none-any.whl python -I -m equipment_data_manager process tests/fixtures/synthetic/repairs_input.csv --report-type repairs --period 2026-09 --output-dir data/ci-wheel-smoke
